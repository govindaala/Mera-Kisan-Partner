# .github/workflows/build-release.yml
name: Build & Release Mera Kisan APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build & Direct Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. रिपॉजिटरी चेकआउट
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. जावा JDK 17 एनवायरनमेंट सेटअप
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle टूल और Wrapper की तैयारी
        uses: gradle/actions/setup-gradle@v3

      - name: 4. gradlew फ़ाइल और परमिशन की पुष्टि
        run: |
          echo "=== डायरेक्टरी और gradlew सत्यापन ==="
          # यदि रूट में gradlew न हो तो सब-फ़ोल्डर में खोजें
          if [ ! -f "./gradlew" ]; then
            echo "रूट में gradlew नहीं मिला, सब-डायरेक्टरी खोजी जा रही है..."
            FOUND_GRADLEW=$(find . -name "gradlew" | head -n 1)
            if [ -n "$FOUND_GRADLEW" ]; then
              cp "$FOUND_GRADLEW" ./gradlew
            else
              echo "नया gradlew बूटस्ट्रैप जनरेट किया जा रहा है..."
              gradle wrapper --gradle-version 8.5 || true
            fi
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "gradlew तैयार और एक्ज़ीक्यूटेबल है।"
          else
            echo "gradlew नहीं बना, सीधे सिस्टम gradle से बिल्ड होगा।"
          fi

      - name: 5. Android APK संकलन (Assemble Debug APK)
        id: assemble_gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 6. APK फ़ाइल निकालना व नामकरण
        id: package_apk
        if: success()
        run: |
          FOUND_APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "::error::कोई APK फ़ाइल नहीं मिली!"
            exit 1
          fi
          echo "APK फ़ाइल मिली: $FOUND_APK"
          mkdir -p release_assets
          cp "$FOUND_APK" release_assets/MeraKisan-App.apk
          echo "apk_path=release_assets/MeraKisan-App.apk" >> $GITHUB_OUTPUT

      - name: 7. GitHub Releases में डायरेक्ट APK पब्लिश
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MERA KISAN Official APK (Build #${{ github.run_number }})
          body: |
            🌾 MERA KISAN Android Application — आधिकारिक APK

            - बिल्ड संख्या: #${{ github.run_number }}
            - कमिट: ${{ github.sha }}
            - स्थिति: सीधा इंस्टॉलेबल APK (बिना ZIP फ़ाइल के)

            ⬇️ सीधा डाउनलोड लिंक:
            नीचे Assets में MeraKisan-App.apk पर क्लिक करके अपने फोन में इंस्टॉल करें।
          draft: false
          prerelease: false
          files: release_assets/MeraKisan-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
