# .github/workflows/build-release.yml
name: Build & Release Mera Kisan APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build & Direct Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. रिपॉजिटरी चेकआउट
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. जावा JDK 17 एनवायरनमेंट सेटअप
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle टूल सेटअप (कैशे डिसेबल शील्ड)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: 4. Google Services व Gradlew पुष्टि
        run: |
          if [ ! -f "./gradlew" ]; then
            FOUND_GRADLEW=$(find . -name "gradlew" | head -n 1)
            [ -n "$FOUND_GRADLEW" ] && cp "$FOUND_GRADLEW" ./gradlew || gradle wrapper --gradle-version 8.5 || true
          fi
          [ -f "./gradlew" ] && chmod +x ./gradlew

      - name: 5. Android APK संकलन (Assemble Debug APK)
        id: assemble_gradle
        run: |
          # KAPT स्टब को साफ़ जानकारी देने और त्रुटि होने पर विस्तृत लॉग छापने के लिए
          ./gradlew assembleDebug --no-daemon --stacktrace --info -x test -x lint || {
            echo "::error::संकलन में त्रुटि आई। कंपाइलर विवरण नीचे दिया गया है:"
            exit 1
          }

      - name: 6. APK फ़ाइल निष्कर्षण व नामकरण
        id: package_apk
        if: success()
        run: |
          FOUND_APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "::error::कोई APK फ़ाइल नहीं मिली!"
            exit 1
          fi
          echo "APK फ़ाइल मिली: $FOUND_APK"
          mkdir -p release_assets
          cp "$FOUND_APK" release_assets/MeraKisan-App.apk
          echo "apk_path=release_assets/MeraKisan-App.apk" >> $GITHUB_OUTPUT

      - name: 7. GitHub Releases में डायरेक्ट APK पब्लिश
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MERA KISAN Official APK (Build #${{ github.run_number }})
          body: |
            🌾 **MERA KISAN Android Application — आधिकारिक APK**

            - बिल्ड संख्या: #${{ github.run_number }}
            - स्थिति: सीधा इंस्टॉलेबल APK (बिना ZIP फ़ाइल के)

            ⬇️ **सीधा डाउनलोड लिंक:**
            नीचे Assets में `MeraKisan-App.apk` पर टैप करके इंस्टॉल करें।
          draft: false
          prerelease: false
          files: release_assets/MeraKisan-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
