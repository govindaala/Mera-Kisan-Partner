# .github/workflows/build-release.yml
name: Build & Release Mera Kisan APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build & Direct Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Java JDK 17 Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle Tool Setup
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: 4. Google Services & Gradlew Validation
        run: |
          if [ ! -f "./gradlew" ]; then
            FOUND_GRADLEW=$(find . -name "gradlew" | head -n 1)
            [ -n "$FOUND_GRADLEW" ] && cp "$FOUND_GRADLEW" ./gradlew || gradle wrapper --gradle-version 8.5 || true
          fi
          [ -f "./gradlew" ] && chmod +x ./gradlew

      - name: 5. Android APK Clean Assemble (Fresh Stubs & Release)
        id: assemble_gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --no-configuration-cache --no-build-cache -x test -x lint

      - name: 6. APK Extraction
        id: package_apk
        if: success()
        run: |
          FOUND_APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "::error::Koi APK file nahi mili!"
            exit 1
          fi
          echo "APK mili: $FOUND_APK"
          mkdir -p release_assets
          cp "$FOUND_APK" release_assets/MeraKisan-App.apk
          echo "apk_path=release_assets/MeraKisan-App.apk" >> $GITHUB_OUTPUT

      - name: 7. Direct Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MERA KISAN Official APK (Build #${{ github.run_number }})
          body: |
            🌾 **MERA KISAN Android Application — Official APK**

            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Status: Direct installable APK (No ZIP)

            ⬇️ **Direct Download:**
            Niche Assets section me `MeraKisan-App.apk` par tap karke download karein.
          draft: false
          prerelease: false
          files: release_assets/MeraKisan-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
