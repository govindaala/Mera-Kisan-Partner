name: Build & Release Mera Kisan APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Direct Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. रिपॉजिटरी चेकआउट
        uses: actions/checkout@v4

      - name: 2. जावा JDK 17 सेटअप
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle 8.5 सेटअप
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: 4. स्थायी Debug Keystore कैशिंग (ताकि SHA-1 कभी न बदले)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mera-kisan-permanent-debug-keystore-v1

      - name: 5. स्थायी Keystore और Wrapper सुनिश्चित करें
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Creating permanent debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MeraKisanDebug, OU=Partner, O=MeraKisan, L=Mandsaur, ST=MP, C=IN"
          else
            echo "Permanent debug keystore restored from cache."
          fi

          if [ ! -f "gradlew" ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: 5.1 सभी Kotlin फाइलों में 'in' पैकेज और इम्पोर्ट सिंटैक्स ऑटो-फिक्स
        run: |
          python3 - << 'EOF'
          import glob, re

          kt_files = glob.glob("app/src/**/*.kt", recursive=True)
          fixed_count = 0

          for path in kt_files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              original = content

              # 1. यदि किसी फाइल में गलती से markdown ```kotlin या ``` आ गया हो तो हटाएँ
              content = re.sub(r"^\s*```(?:kotlin)?\s*$", "", content, flags=re.MULTILINE)

              # 2. package और import में बिना बैकटिक वाले in.merakisan को `in`.merakisan में बदलें
              content = re.sub(
                  r"^(\s*(?:package|import)\s+)in\.merakisan\b",
                  r"\1`in`.merakisan",
                  content,
                  flags=re.MULTILINE
              )

              # 3. कोड के अंदर बिना बैकटिक या कोट्स वाले in.merakisan रेफरेंस को भी सुरक्षित करें
              content = re.sub(
                  r"(?<![`\"\w/])in\.merakisan\b",
                  r"`in`.merakisan",
                  content
              )

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  fixed_count += 1
                  print(f"Sanitized 'in' syntax in: {path}")

          print(f"Total Kotlin files sanitized: {fixed_count} / {len(kt_files)}")
          EOF

      - name: 6. स्थायी Firebase SHA फिंगरप्रिंट्स प्रिंट करें
        run: |
          echo "=========================================================="
          echo "🌾 MERA KISAN — FIREBASE PERMANENT SHA KEYS"
          echo "=========================================================="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          echo "=========================================================="

      - name: 7. APK संकलन (ऑटो-वर्शनिंग — Direct Update)
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.1.${{ github.run_number }}" \
            -Pkapt.verbose=true \
            --continue \
            --stacktrace

      - name: 8. APK निष्कर्षण व सत्यापन
        id: apk_verify
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 9. GitHub Releases में APK पब्लिश
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          files: ${{ steps.apk_verify.outputs.apk_path }}
          tag_name: "v1.1-build-${{ github.run_number }}"
          name: "Mera Kisan Release v1.1 (#${{ github.run_number }})"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 10. विफलता पर सटीक Kotlin एरर लाइन प्रिंट करें
        if: failure()
        run: |
          echo "=========================================================="
          echo "🔍 EXACT KOTLIN COMPILER ERRORS (FILE & LINE NUMBER):"
          echo "=========================================================="
          ./gradlew compileDebugKotlin --console=plain > build_raw.log 2>&1 || true
          grep -E "^e: " build_raw.log || tail -n 100 build_raw.log
          echo "=========================================================="

      - name: 11. एरर रिपोर्ट अपलोड
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mera-kisan-build-diagnostics-${{ github.run_number }}
          path: |
            build_raw.log
            app/build/reports/
          if-no-files-found: ignore
