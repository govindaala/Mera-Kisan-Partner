name: Build, SHA Fingerprint & Release Mera Kisan APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build APK and Get SHA Fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # --------------------------------------------------
      # 1. Repository checkout
      # --------------------------------------------------
      - name: 1. Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Gradle 8.5
      # --------------------------------------------------
      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      # --------------------------------------------------
      # 4. Environment preparation
      # --------------------------------------------------
      - name: 4. Prepare Android Build Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          if [ ! -d "app" ]; then
            echo "::error::Android app directory not found."
            exit 1
          fi

          # Preserve the package/import sanitization
          # used by the previous workflow.
          if [ -d "app/src/main/java" ]; then
            find app/src/main/java -type f -name "*.kt" \
              -exec sed -i -E \
              's/^package[[:space:]]+in\./package `in`./g' {} +

            find app/src/main/java -type f -name "*.kt" \
              -exec sed -i -E \
              's/^import[[:space:]]+in\./import `in`./g' {} +
          fi

          # Verify Gradle wrapper.
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing. Creating wrapper..."

            gradle wrapper \
              --gradle-version 8.5 \
              --no-configuration-cache
          fi

          chmod +x ./gradlew

          touch gradle.properties

          grep -qxF 'kapt.verbose=true' gradle.properties ||
            echo 'kapt.verbose=true' >> gradle.properties

          grep -qxF 'kapt.use.worker.api=false' gradle.properties ||
            echo 'kapt.use.worker.api=false' >> gradle.properties

          grep -qxF 'kotlin.compiler.execution.strategy=in-process' gradle.properties ||
            echo 'kotlin.compiler.execution.strategy=in-process' >> gradle.properties

          grep -qxF 'org.gradle.configuration-cache=false' gradle.properties ||
            echo 'org.gradle.configuration-cache=false' >> gradle.properties

          echo "Build environment prepared."

      # --------------------------------------------------
      # 5. Generate SHA fingerprint report
      # --------------------------------------------------
      - name: 5. Generate SHA-1 and SHA-256 Report
        id: fingerprints
        shell: bash
        run: |
          set -uo pipefail

          echo "Generating Android signing report..."

          ./gradlew :app:signingReport \
            --no-daemon \
            --no-configuration-cache \
            --console=plain 2>&1 | tee signing_report.log

          REPORT_STATUS=${PIPESTATUS[0]}

          if [ "$REPORT_STATUS" -ne 0 ]; then
            echo "::warning::Signing report task failed. Build will continue."
          fi

          echo ""
          echo "========== DEBUG KEYSTORE =========="

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt || true
          fi

          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android 2>&1 | tee debug_fingerprint.txt || true
          fi

          echo ""
          echo "========== SIGNING REPORT =========="

          if [ -f signing_report.log ]; then
            grep -E -A 8 \
              'Variant: debug|SHA1:|SHA-1:|SHA-256:' \
              signing_report.log || true
          fi

          echo "Fingerprint reporting step finished."

      # --------------------------------------------------
      # 6. Build Debug APK
      # --------------------------------------------------
      - name: 6. Build Debug APK (KAPT Tasks Excluded)
        id: build_apk
        shell: bash
        run: |
          set -uo pipefail

          echo "Starting Android APK build..."
          echo "Excluding selected KAPT tasks for this build."

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --console=plain \
            -x test \
            -x lint \
            -x kaptGenerateStubsDebugKotlin \
            -x kaptDebugKotlin \
            2>&1 | tee build_raw.log

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Android APK build failed."
            exit "$BUILD_STATUS"
          fi

          echo "Android APK build completed successfully."

      # --------------------------------------------------
      # 7. Verify APK and extract certificate fingerprint
      # --------------------------------------------------
      - name: 7. Verify APK and Read Signing Certificate
        id: package_apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            ! -path '*/intermediates/*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK file was generated."
            exit 1
          fi

          mkdir -p release_assets

          cp "$APK" release_assets/MeraKisan-App.apk

          echo "APK_PATH=release_assets/MeraKisan-App.apk" >> "$GITHUB_ENV"

          echo "APK_SIZE=$(du -h release_assets/MeraKisan-App.apk | cut -f1)" >> "$GITHUB_ENV"

          echo "APK successfully copied:"
          ls -lh release_assets/MeraKisan-App.apk

          # Locate Android SDK apksigner.
          APKSIGNER=""

          if [ -n "${ANDROID_HOME:-}" ] &&
             [ -d "$ANDROID_HOME/build-tools" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner 2>/dev/null \
              | sort -V | tail -n 1 || true)"
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs \
              release_assets/MeraKisan-App.apk \
              2>&1 | tee apk_certificate.txt || true
          else
            echo "apksigner not found." | tee apk_certificate.txt
          fi

      # --------------------------------------------------
      # 8. Upload APK and reports
      # --------------------------------------------------
      - name: 8. Upload APK and Fingerprint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mera-Kisan-Build-Reports
          path: |
            release_assets/MeraKisan-App.apk
            signing_report.log
            debug_fingerprint.txt
            apk_certificate.txt
            build_raw.log
          if-no-files-found: ignore
          retention-days: 30

      # --------------------------------------------------
      # 9. Publish GitHub Release
      # --------------------------------------------------
      - name: 9. Publish APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MERA KISAN APK - Build ${{ github.run_number }}
          body: |
            MERA KISAN Android Application

            Build number: #${{ github.run_number }}
            APK size: ${{ env.APK_SIZE }}

            Download MeraKisan-App.apk from the Assets section.
          draft: false
          prerelease: false
          files: release_assets/MeraKisan-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 10. Diagnostics on failure
      # --------------------------------------------------
      - name: 10. Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mera-Kisan-Build-Diagnostics
          path: |
            build_raw.log
            signing_report.log
            debug_fingerprint.txt
            apk_certificate.txt
          if-no-files-found: ignore
          retention-days: 14
