name: Build, SHA Fingerprint & Release Mera Kisan APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build APK and Get SHA Fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      # 4. Prepare environment
      - name: Prepare Android Build Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          if [ ! -d "app" ]; then
            echo "::error::Android app directory not found."
            exit 1
          fi

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Creating wrapper..."
            gradle wrapper --gradle-version 8.5
          fi

          chmod +x ./gradlew

          touch gradle.properties

          grep -qxF 'kapt.verbose=true' gradle.properties ||
            echo 'kapt.verbose=true' >> gradle.properties

          grep -qxF 'kapt.use.worker.api=false' gradle.properties ||
            echo 'kapt.use.worker.api=false' >> gradle.properties

          grep -qxF 'kotlin.compiler.execution.strategy=in-process' gradle.properties ||
            echo 'kotlin.compiler.execution.strategy=in-process' >> gradle.properties

          grep -qxF 'org.gradle.configuration-cache=false' gradle.properties ||
            echo 'org.gradle.configuration-cache=false' >> gradle.properties

          echo "Environment prepared."

      # 5. Generate the debug signing report
      # This runs separately from APK compilation.
      - name: Generate SHA-1 and SHA-256 Report
        id: fingerprints
        shell: bash
        run: |
          set -uo pipefail

          echo "Generating Android signing report..."

          ./gradlew :app:signingReport \
            --no-daemon \
            --no-configuration-cache \
            --console=plain 2>&1 | tee signing_report.log

          REPORT_STATUS=${PIPESTATUS[0]}

          if [ "$REPORT_STATUS" -ne 0 ]; then
            echo "::warning::Gradle signingReport task failed."
          fi

          echo ""
          echo "========== DEBUG FINGERPRINTS =========="

          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android 2>&1 | tee debug_fingerprint.txt || true
          else
            echo "Debug keystore not found yet."
            echo "It may be generated during the Android build."
          fi

          echo ""
          echo "========== SIGNING REPORT SUMMARY =========="

          if [ -f signing_report.log ]; then
            grep -E -A 8 'Variant: debug|SHA1:|SHA-1:|SHA-256:' \
              signing_report.log || true
          fi

          echo "Fingerprint step finished."

      # 6. Build APK
      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          set -uo pipefail

          echo "Starting Android APK build..."

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --console=plain \
            -x test \
            -x lint 2>&1 | tee build_raw.log

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Android APK build failed."
            exit "$BUILD_STATUS"
          fi

          echo "APK build completed."

      # 7. Verify APK and extract its signing certificate
      - name: Verify APK and Read Certificate Fingerprints
        id: package_apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            ! -path '*/intermediates/*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          mkdir -p release_assets

          cp "$APK" release_assets/MeraKisan-App.apk

          echo "APK_PATH=release_assets/MeraKisan-App.apk" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h release_assets/MeraKisan-App.apk | cut -f1)" >> "$GITHUB_ENV"

          echo "APK generated:"
          ls -lh release_assets/MeraKisan-App.apk

          # Read the certificate from the actual APK.
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER="$(command -v apksigner)"
          else
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs \
              release_assets/MeraKisan-App.apk \
              2>&1 | tee apk_certificate.txt || true
          else
            echo "apksigner not found; debug keystore report is available instead."
          fi

      # 8. Upload APK and reports as downloadable artifacts
      - name: Upload APK and Fingerprint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mera-Kisan-Build-Reports
          path: |
            release_assets/MeraKisan-App.apk
            signing_report.log
            debug_fingerprint.txt
            apk_certificate.txt
            build_raw.log
          if-no-files-found: ignore
          retention-days: 30

      # 9. Publish release only after successful build
      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MERA KISAN APK - Build ${{ github.run_number }}
          body: |
            MERA KISAN Android Application

            Build number: ${{ github.run_number }}
            APK size: ${{ env.APK_SIZE }}

            Download MeraKisan-App.apk from the Assets section.
          draft: false
          prerelease: false
          files: release_assets/MeraKisan-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10. Save diagnostics on failure
      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mera-Kisan-Build-Diagnostics
          path: |
            build_raw.log
            signing_report.log
            debug_fingerprint.txt
            apk_certificate.txt
          if-no-files-found: ignore
          retention-days: 14
