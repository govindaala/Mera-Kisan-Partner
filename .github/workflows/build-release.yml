name: Build, Fingerprint & Release Mera Kisan APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build APK and Get SHA Fingerprints
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Java 17 setup
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      # 4. Prepare project and Gradle wrapper
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi

          chmod +x ./gradlew

          touch gradle.properties

          grep -qxF 'kapt.verbose=true' gradle.properties || \
            echo 'kapt.verbose=true' >> gradle.properties

          grep -qxF 'kapt.use.worker.api=false' gradle.properties || \
            echo 'kapt.use.worker.api=false' >> gradle.properties

          grep -qxF 'kotlin.compiler.execution.strategy=in-process' gradle.properties || \
            echo 'kotlin.compiler.execution.strategy=in-process' >> gradle.properties

          grep -qxF 'org.gradle.configuration-cache=false' gradle.properties || \
            echo 'org.gradle.configuration-cache=false' >> gradle.properties

      # 5. Print SHA-1 and SHA-256 fingerprints
      - name: Get SHA-1 and SHA-256 Fingerprints
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "ANDROID SIGNING FINGERPRINT REPORT"
          echo "=========================================="

          ./gradlew :app:signingReport \
            --no-daemon \
            --no-configuration-cache \
            --console=plain 2>&1 | tee signing_report.log

          echo ""
          echo "=========================================="
          echo "FINGERPRINTS FOR DEBUG VARIANT"
          echo "=========================================="

          python3 - <<'PY'
          import re

          path = "signing_report.log"
          text = open(path, encoding="utf-8", errors="replace").read()

          blocks = re.split(r"(?m)^\s*Variant:\s*", text)
          found = False

          for block in blocks:
              if not block.strip():
                  continue

              variant = block.splitlines()[0].strip()

              if variant.lower() != "debug":
                  continue

              found = True
              print("Variant:", variant)

              for label in ("Store", "Alias", "SHA1", "SHA-1", "SHA-256", "SHA256"):
                  match = re.search(
                      rf"(?im)^\s*{re.escape(label)}:\s*(.*?)\s*$",
                      block
                  )
                  if match:
                      print(f"{label}: {match.group(1)}")

          if not found:
              print("Debug variant report mein nahi mila.")
              print("Neeche signing_report.log artifact mein dekhein.")
          PY

      # 6. Build debug APK
      - name: Build Debug APK
        id: assemble_gradle
        shell: bash
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --console=plain \
            -x test \
            -x lint 2>&1 | tee build_raw.log

      # 7. Verify and copy APK
      - name: Prepare APK
        id: package_apk
        if: success()
        shell: bash
        run: |
          set -e

          FOUND_APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            | head -n 1)

          if [ -z "$FOUND_APK" ]; then
            echo "::error::APK file nahi mili."
            exit 1
          fi

          mkdir -p release_assets

          cp "$FOUND_APK" release_assets/MeraKisan-App.apk

          echo "APK_PATH=release_assets/MeraKisan-App.apk" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h release_assets/MeraKisan-App.apk | cut -f1)" >> "$GITHUB_ENV"

          echo "APK successfully prepared."
          ls -lh release_assets/MeraKisan-App.apk

      # 8. Upload APK and signing report as artifacts
      - name: Upload APK and Fingerprint Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mera-Kisan-APK-and-SHA-Report
          path: |
            release_assets/MeraKisan-App.apk
            signing_report.log
          if-no-files-found: error
          retention-days: 30

      # 9. Publish APK to GitHub Releases
      - name: Publish APK Release
        if: success() && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MERA KISAN APK - Build ${{ github.run_number }}
          body: |
            MERA KISAN Android Application

            Build: #${{ github.run_number }}
            APK size: ${{ env.APK_SIZE }}

            Download MeraKisan-App.apk from Assets below.
          draft: false
          prerelease: false
          files: release_assets/MeraKisan-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10. Save diagnostic logs if build fails
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mera-Kisan-Build-Diagnostics
          path: |
            signing_report.log
            build_raw.log
          if-no-files-found: ignore
          retention-days: 14
