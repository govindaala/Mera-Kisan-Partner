# .github/workflows/build-release.yml

name: Build & Release Mera Kisan APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build & Direct Release APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Repository checkout
      # --------------------------------------------------
      - name: 1. रिपॉजिटरी चेकआउट
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Java JDK 17
      # --------------------------------------------------
      - name: 2. जावा JDK 17 सेटअप
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Gradle
      # --------------------------------------------------
      - name: 3. Gradle टूल सेटअप
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      # --------------------------------------------------
      # 4. Environment preparation
      # --------------------------------------------------
      - name: 4. ऑटो-सैनिटाइज़र व एनवायरनमेंट तैयारी
        shell: bash
        run: |
          set -e

          echo "=== 1. Kotlin package और import की जाँच ==="

          if [ -d "app/src/main/java" ]; then
            find app/src/main/java -type f -name "*.kt" \
              -exec sed -i -E \
              's/^package[[:space:]]+in\./package `in`./g' {} +

            find app/src/main/java -type f -name "*.kt" \
              -exec sed -i -E \
              's/^import[[:space:]]+in\./import `in`./g' {} +
          fi

          echo "=== 2. Gradle Wrapper की पुष्टि ==="

          if [ ! -f "./gradlew" ]; then
            gradle wrapper \
              --gradle-version 8.5 \
              --no-configuration-cache || true
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "::error::Gradle Wrapper उपलब्ध नहीं है!"
            exit 1
          fi

          touch gradle.properties

          grep -qxF 'kapt.verbose=true' gradle.properties ||
            echo 'kapt.verbose=true' >> gradle.properties

          grep -qxF 'kapt.use.worker.api=false' gradle.properties ||
            echo 'kapt.use.worker.api=false' >> gradle.properties

          grep -qxF 'kotlin.compiler.execution.strategy=in-process' gradle.properties ||
            echo 'kotlin.compiler.execution.strategy=in-process' >> gradle.properties

          grep -qxF 'org.gradle.configuration-cache=false' gradle.properties ||
            echo 'org.gradle.configuration-cache=false' >> gradle.properties

          echo "=== Environment तैयार है ==="

      # --------------------------------------------------
      # 5. Build Debug APK
      # --------------------------------------------------
      - name: 5. Android APK क्लीन संकलन
        id: assemble_gradle
        shell: bash
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --console=plain \
            -x test \
            -x lint \
            2>&1 | tee build_raw.log

      # --------------------------------------------------
      # 5.1. Optional SHA fingerprints
      # --------------------------------------------------
      - name: 5.1 Print Keystore SHA Fingerprints
        if: success()
        shell: bash
        run: |
          KS="$HOME/.android/debug.keystore"

          if [ ! -f "$KS" ]; then
            echo "Debug keystore नहीं मिली।"
            echo "SHA fingerprints छोड़कर Workflow जारी रहेगी।"
            exit 0
          fi

          OUTPUT=$(keytool -list -v \
            -keystore "$KS" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android 2>&1) || {
              echo "Keystore पढ़ने में समस्या हुई:"
              echo "$OUTPUT"
              echo "SHA fingerprints उपलब्ध नहीं हैं।"
              echo "Workflow जारी रहेगी।"
              exit 0
            }

          echo "$OUTPUT"

          if ! printf '%s\n' "$OUTPUT" |
            grep -E 'SHA1:|SHA256:'; then
            echo "SHA fingerprint lines नहीं मिलीं।"
            echo "Workflow जारी रहेगी।"
          fi

      # --------------------------------------------------
      # 6. Find and validate APK
      # --------------------------------------------------
      - name: 6. APK निष्कर्षण व सत्यापन
        id: package_apk
        if: success()
        shell: bash
        run: |
          set -e

          FOUND_APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            ! -path "*/intermediates/*" \
            2>/dev/null | head -n 1)

          if [ -z "$FOUND_APK" ]; then
            echo "::error::कोई APK फ़ाइल नहीं मिली!"
            echo "APK output directory की जाँच करें।"
            exit 1
          fi

          echo "APK प्राप्त हुई: $FOUND_APK"

          mkdir -p release_assets

          cp "$FOUND_APK" release_assets/MeraKisan-App.apk

          echo "apk_path=release_assets/MeraKisan-App.apk" >> "$GITHUB_OUTPUT"

          echo "APK_SIZE=$(du -h release_assets/MeraKisan-App.apk | cut -f1)" >> "$GITHUB_ENV"

          echo "APK_SIZE_BYTES=$(stat -c%s release_assets/MeraKisan-App.apk)" >> "$GITHUB_ENV"

          echo "APK सफलतापूर्वक तैयार हुई।"
          ls -lh release_assets/MeraKisan-App.apk

      # --------------------------------------------------
      # 7. Publish GitHub Release
      # --------------------------------------------------
      - name: 7. GitHub Releases में डायरेक्ट APK पब्लिश
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MERA KISAN Official APK (Build #${{ github.run_number }})
          body: |
            🌾 **MERA KISAN Android Application — आधिकारिक APK**

            - बिल्ड संख्या: #${{ github.run_number }}
            - स्थिति: इंस्टॉल करने योग्य Android APK
            - APK आकार: ${{ env.APK_SIZE }}

            ⬇️ **डाउनलोड:**
            Assets में `MeraKisan-App.apk` पर टैप करके डाउनलोड करें।
          draft: false
          prerelease: false
          files: release_assets/MeraKisan-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 8. Build error diagnostics
      # --------------------------------------------------
      - name: 8. विस्तृत बिल्ड एरर डायग्नोस्टिक्स
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          from collections import Counter

          LOG_FILE = "build_raw.log"
          REPORT_FILE = "build_error_report.txt"
          JSON_FILE = "build_error_report.json"
          SUMMARY_FILE = os.environ.get("GITHUB_STEP_SUMMARY", "")

          errors = []
          seen = set()

          def print_both(message=""):
              print(message)
              if SUMMARY_FILE:
                  with open(SUMMARY_FILE, "a", encoding="utf-8") as f:
                      f.write(message + "\n")

          def clean_path(path):
              path = path.strip().strip("'\"")
              return re.sub(r"^file://", "", path)

          def categorize(message):
              m = message.lower()

              if any(x in m for x in [
                  "unresolved reference",
                  "overload resolution ambiguity",
                  "type mismatch",
                  "cannot infer",
                  "expecting ",
                  "syntax error",
                  "redeclaration",
                  "no value passed for parameter",
                  "too many arguments",
                  "cannot find a parameter",
                  "smart cast",
                  "variable expected"
              ]):
                  return "Kotlin / कोड"

              if "manifest merger failed" in m:
                  return "Android Manifest"

              if any(x in m for x in [
                  "could not resolve",
                  "could not find ",
                  "failed to resolve",
                  "could not download",
                  "no matching variant"
              ]):
                  return "Dependency / लाइब्रेरी"

              if any(x in m for x in [
                  "resource linking failed",
                  "resource not found",
                  "duplicate resources",
                  "android resource compilation failed"
              ]):
                  return "Android Resources"

              if any(x in m for x in [
                  "cannot find symbol",
                  "package does not exist",
                  "java compiler",
                  "compilation failed"
              ]):
                  return "Java / Compilation"

              if any(x in m for x in [
                  "sdk location not found",
                  "failed to find target",
                  "build tools revision"
              ]):
                  return "Android SDK"

              if any(x in m for x in [
                  "execution failed for task",
                  "what went wrong",
                  "build failed with an exception",
                  "plugin was not found"
              ]):
                  return "Gradle / Build Configuration"

              if any(x in m for x in [
                  "outofmemoryerror",
                  "java heap space",
                  "gc overhead limit exceeded"
              ]):
                  return "Memory / JVM"

              if any(x in m for x in [
                  "timed out",
                  "connection reset",
                  "connection refused",
                  "unknownhostexception",
                  "could not get resource"
              ]):
                  return "Network / Download"

              if any(x in m for x in [
                  "duplicate class",
                  "class is defined multiple times"
              ]):
                  return "Duplicate Class / Dependency"

              if any(x in m for x in [
                  "signingconfig",
                  "keystore",
                  "failed to read key",
                  "signing failed"
              ]):
                  return "APK Signing"

              if any(x in m for x in [
                  "zipalign",
                  "apksigner",
                  "failed to package",
                  "packageapplication"
              ]):
                  return "APK Packaging"

              return "Gradle / अन्य"

          def add_error(category, path="", line=0, col=0,
                        message="", origin=""):
              key = (category, path, line, col, message)

              if key in seen:
                  return

              seen.add(key)

              errors.append({
                  "category": category,
                  "file": path,
                  "line": line,
                  "column": col,
                  "message": message.strip(),
                  "origin": origin
              })

          if os.path.isfile(LOG_FILE):
              with open(LOG_FILE, encoding="utf-8",
                        errors="replace") as f:
                  log_lines = f.readlines()
          else:
              log_lines = []

          kotlin_pattern = re.compile(
              r"^\s*e:\s+(?:file://)?(.+?):(\d+):(\d+)\s+(.*)$",
              re.IGNORECASE
          )

          java_pattern = re.compile(
              r"^\s*(.+?\.java):(\d+):\s*error:\s*(.*)$",
              re.IGNORECASE
          )

          generic_pattern = re.compile(
              r"^\s*(.+?\.(?:kt|java|xml)):(\d+):(\d+):\s*"
              r"error:\s*(.*)$",
              re.IGNORECASE
          )

          for raw in log_lines:
              line_text = raw.rstrip("\n")

              match = kotlin_pattern.match(line_text)
              if match:
                  add_error(
                      categorize(match.group(4)),
                      clean_path(match.group(1)),
                      int(match.group(2)),
                      int(match.group(3)),
                      match.group(4),
                      "Kotlin compiler"
                  )
                  continue

              match = java_pattern.match(line_text)
              if match:
                  add_error(
                      categorize(match.group(3)),
                      clean_path(match.group(1)),
                      int(match.group(2)),
                      1,
                      match.group(3),
                      "Java compiler"
                  )
                  continue

              match = generic_pattern.match(line_text)
              if match:
                  add_error(
                      categorize(match.group(4)),
                      clean_path(match.group(1)),
                      int(match.group(2)),
                      int(match.group(3)),
                      match.group(4),
                      "Compiler / Resource"
                  )

          important_patterns = [
              re.compile(r"^\s*FAILURE:\s+Build failed", re.I),
              re.compile(r"^\s*Execution failed for task ", re.I),
              re.compile(r"^\s*Could not resolve all files", re.I),
              re.compile(r"^\s*Could not resolve ", re.I),
              re.compile(r"^\s*Could not find ", re.I),
              re.compile(r"^\s*Plugin \[id:", re.I),
              re.compile(r"^\s*Manifest merger failed", re.I),
              re.compile(r"^\s*Android resource linking failed", re.I),
              re.compile(r"^\s*OutOfMemoryError", re.I),
              re.compile(r"^\s*What went wrong:", re.I),
              re.compile(r"^\s*BUILD FAILED", re.I)
          ]

          for raw in log_lines:
              line_text = raw.strip()

              if not line_text:
                  continue

              if any(pattern.search(line_text)
                     for pattern in important_patterns):
                  add_error(
                      categorize(line_text),
                      message=line_text,
                      origin="Gradle / Build log"
                  )

          # Fallback: only inspect the end of the log for
          # explicit error indicators if no errors were recognized.
          if not errors:
              fallback_patterns = [
                  re.compile(r"^\s*e:\s+", re.I),
                  re.compile(r"^\s*error:", re.I),
                  re.compile(r"^\s*FAILURE:", re.I),
                  re.compile(r"^\s*BUILD FAILED", re.I),
                  re.compile(r"^\s*Execution failed for task ", re.I),
                  re.compile(r"^\s*What went wrong:", re.I)
              ]

              candidates = [
                  line.strip()
                  for line in log_lines
                  if any(p.search(line) for p in fallback_patterns)
              ]

              for message in candidates[-25:]:
                  add_error(
                      categorize(message),
                      message=message,
                      origin="Fallback error detection"
                  )

          categories = Counter(
              error["category"] for error in errors
          )

          with open(REPORT_FILE, "w", encoding="utf-8") as report:
              report.write("=" * 80 + "\n")
              report.write("MERA KISAN — BUILD ERROR REPORT\n")
              report.write("=" * 80 + "\n")
              report.write(
                  f"पहचानी गई रिपोर्ट प्रविष्टियाँ: {len(errors)}\n"
              )
              report.write(
                  f"Build log उपलब्ध: {os.path.isfile(LOG_FILE)}\n\n"
              )

              for category, count in categories.most_common():
                  report.write(f"{category}: {count}\n")

              if not errors:
                  report.write(
                      "\nपहचाने जाने योग्य compiler/Gradle errors नहीं मिले।\n"
                      "विफलता किसी दूसरे workflow step में भी हो सकती है।\n"
                  )

              for index, error in enumerate(errors, 1):
                  report.write("\n" + "-" * 80 + "\n")
                  report.write(
                      f"Error #{index}: {error['category']}\n"
                  )
                  report.write(
                      f"Source: {error['origin']}\n"
                  )

                  if error["file"]:
                      report.write(f"File: {error['file']}\n")

                  if error["line"]:
                      report.write(
                          f"Line: {error['line']}, "
                          f"Column: {error['column']}\n"
                      )

                  report.write(
                      f"Message: {error['message']}\n"
                  )

          with open(JSON_FILE, "w", encoding="utf-8") as f:
              json.dump(errors, f, ensure_ascii=False, indent=2)

          print_both("=" * 80)
          print_both("MERA KISAN — BUILD DIAGNOSTICS")
          print_both(f"पहचानी गई प्रविष्टियाँ: {len(errors)}")
          print_both("=" * 80)

          for category, count in categories.most_common():
              print_both(f"{category}: {count}")

          for start in range(0, len(errors), 25):
              block = errors[start:start + 25]

              print_both("")
              print_both(
                  f"BLOCK {start // 25 + 1}: "
                  f"Entries {start + 1}–{start + len(block)}"
              )

              for index, error in enumerate(block, start + 1):
                  print_both(
                      f"\n[{index}] {error['category']}: "
                      f"{error['message']}"
                  )

                  if error["file"]:
                      print_both(
                          f"File: {error['file']}"
                      )

                  if error["line"]:
                      print_both(
                          f"Line: {error['
