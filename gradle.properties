# ============================================================
# MERA KISAN — ANDROID GRADLE PROPERTIES CONFIGURATION
# Clean Rebuild Architecture (Java 17 & AGP 8.3+)
# ============================================================

# 1. JVM Memory & Daemon Optimization
# Memory allocation ko 2048m-3072m par rakha gaya hai taaki Kotlin compiler,
# Kapt (Room), aur ProGuard bina OutOfMemoryError ke fast execute hon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# 2. Parallel Execution & Build Caching
# Multiple CPU cores ka upayog karke tasks ko parallel me run karta hai
# aur unchanged tasks ka cache reuse karke build time bachata hai.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true

# 3. AndroidX & Jetpack Tooling
# Legacy support libraries ko block karke pure AndroidX ecosystem enforce karta hai.
android.useAndroidX=true

# Resource namespacing aur build speed optimize karne ke liye R class ko non-transitive banata hai.
android.nonTransitiveRClass=true

# Default resource shrinking aur deterministic asset packaging ko activate karta hai.
android.enableR8.fullMode=true

# 4. Kotlin & Kapt Annotation Processing (Room Database)
# Room database schemas ke fast compilation ke liye incremental Kapt processing.
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false

# Kotlin code style official formatting rules enforce karta hai.
kotlin.code.style=official

# 5. Security & Privacy Safeguards
# CRITICAL RULE (Master Spec Sec 3, 21 & 29):
# Kisi bhi API Key, Firebase service account secret, Google Drive OAuth token,
# Cashfree credentials ya release keystore password ko is file me declare NA karein.
# Sabhi sensitive keys server-side (Vercel) ya Android Keystore-backed storage me rahengi.
